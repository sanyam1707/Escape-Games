<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Secrets of the Pharaoh</title>
<meta name="description" content="A 360 point-and-click escape game. Seal broken, door locked, ten minutes on the clock.">
<meta property="og:title" content="Secrets of the Pharaoh">
<meta property="og:description" content="Escape the tomb before the sand wins.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/title.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1C1A17">
<link rel="stylesheet" href="vendor/pannellum.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="pano"></div>
  <div id="stage"><div id="hs"></div><div id="seshk"></div></div>
  <canvas id="fxc"></canvas>
  <div id="vig"></div>
  <div id="edge"></div>
  <div id="sand"></div>

  <div id="hud" hidden>
    <div id="bar">
      <div id="score" class="pill" title="Ankhs"><svg class="ico fb"><use href="#i-ankh"/></svg><img class="hudico" data-ico="icon_ankh" alt="" hidden><b id="scoreV">0</b></div>
      <div id="timer"><span id="timerV">10:00</span><i id="sandbar"></i></div>
      <div id="btns">
        <button id="bHint" class="ibtn" aria-label="Hint"><svg class="ico fb"><use href="#i-hint"/></svg><img class="hudico" data-ico="icon_hint" alt="" hidden><em id="hintN">3</em></button>
        <button id="bBook" class="ibtn" aria-label="Casebook"><svg class="ico fb"><use href="#i-book"/></svg><img class="hudico" data-ico="icon_casebook" alt="" hidden><em id="bookN" hidden></em></button>
        <button id="bPause" class="ibtn" aria-label="Pause"><svg class="ico fb"><use href="#i-pause"/></svg><img class="hudico" data-ico="icon_pause" alt="" hidden></button>
      </div>
    </div>
    <div id="objective"><span id="objR"></span><span id="objT"></span></div>
    <div id="danger" hidden><svg class="ico" id="dEye"><use href="#i-eye"/></svg><div class="dwrap"><div class="dhead"><b id="dTitle"></b><span id="dState"></span></div><div class="dtrack"><i id="dFill"></i><u></u><u></u><u></u><u></u><u></u></div></div></div>
    <div id="strip" hidden></div>
    <button id="holdchip" hidden></button>
  </div>

  <div id="banner" hidden></div>
  <div id="toasts"></div>
  <div id="layer"></div>
  <div id="dlg" hidden>
    <div id="dBust"></div>
    <div id="dName"></div>
    <div id="dBody"><div id="dText"></div><div id="dTap">tap to continue</div></div>
    <button id="dSkip">Skip</button>
  </div>
  <div id="pausemenu" hidden></div>
  <div id="screens"></div>
  <div id="dbg" hidden></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-ankh" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 1.800c-3.200 0-5.400 2.300-5.400 5.100 0 2.900 2.200 5 5.400 5s5.400-2.100 5.400-5c0-2.800-2.200-5.100-5.400-5.100zm0 2.300c1.800 0 3.100 1.200 3.100 2.800S13.800 9.600 12 9.600 8.900 8.500 8.900 6.900 10.200 4.100 12 4.100z"/><path fill="currentColor" d="M10.800 11.600h2.400v3h4.900v2.400h-4.900v5.200h-2.400V17H5.900v-2.400h4.900z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.900" stroke-linejoin="round" stroke-linecap="round" d="M2.500 5.300c3.200-1.400 6.400-1.200 9.500 1.100v13.300c-3.100-2.300-6.300-2.500-9.500-1.100zM21.500 5.300c-3.200-1.400-6.400-1.200-9.500 1.100v13.300c3.100-2.300 6.300-2.500 9.500-1.100zM5.300 9.200c1.700-.4 3.300-.2 4.700.7M5.300 12.700c1.700-.4 3.300-.2 4.700.7M18.700 9.200c-1.700-.4-3.300-.2-4.700.7M18.700 12.700c-1.700-.4-3.300-.2-4.700.7"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.900" stroke-linejoin="round" stroke-linecap="round" d="M1.800 11.200C5 7.200 8.300 5.500 12 5.500s7 1.700 10.200 5.700c-3.200 3.800-6.500 5.400-10.200 5.400S5 15 1.800 11.200zM3 6.800C6.500 3.800 10.500 3 14.500 3.600M12 16.600v3.200c0 1.300.9 2 2.200 2M9 16l-1.800 4.200c-.5 1.200.2 1.900 1.300 2"/><circle cx="12" cy="11.100" r="3.300" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.500" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/><rect x="14.300" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 13V6a1.500 1.500 0 0 1 3 0v5m0-1V4.500a1.500 1.500 0 0 1 3 0V11m0-4a1.500 1.500 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-3.500a1.500 1.500 0 0 1 2.500-1.500L8 14"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M5 21V8a7 7 0 0 1 14 0v13M3 21h18M12 11v4M9.500 13h5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.200 6.800H21l-5.600 4.100 2.100 6.800L12 15.600 6.500 19.700l2.100-6.800L3 8.800h6.800z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<script src="vendor/pannellum.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
