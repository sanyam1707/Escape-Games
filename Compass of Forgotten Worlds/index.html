<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Compass of Forgotten Worlds</title>
<meta name="description" content="Four sealed rooms. One brass compass. Five minutes before the storm tide.">
<meta property="og:title" content="Compass of Forgotten Worlds">
<meta property="og:description" content="Four sealed rooms. One brass compass. Five minutes before the storm tide.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/title.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <div id="pano"></div>
  <div id="stage"><div id="hs"></div></div>
  <canvas id="fxc"></canvas>
  <div id="vig"></div>
  <div id="edge"></div>

  <div id="hud" hidden>
    <div id="bar">
      <div id="score" class="pill"><svg class="ico fb"><use href="#i-score"/></svg><img class="hudico" data-ico="icon_score" alt="" hidden><b id="scoreV">0</b></div>
      <div id="timer"><span id="timerV">05:00</span><i id="sandbar"></i></div>
      <div id="btns">
        <button id="bHint" class="ibtn"><svg class="ico fb"><use href="#i-hint"/></svg><img class="hudico" data-ico="icon_hint" alt="" hidden><em id="hintN">3</em></button>
        <button id="bBook" class="ibtn"><svg class="ico fb"><use href="#i-book"/></svg><img class="hudico" data-ico="icon_casebook" alt="" hidden><em id="bookN" hidden></em></button>
        <button id="bPause" class="ibtn"><svg class="ico fb"><use href="#i-pause"/></svg><img class="hudico" data-ico="icon_pause" alt="" hidden></button>
      </div>
    </div>
    <div id="objective"><span id="objR"></span><span id="objT"></span></div>
    <div id="strip" hidden></div>
    <button id="holdchip" hidden></button>
  </div>

  <div id="banner" hidden></div>
  <div id="toasts"></div>
  <div id="layer"></div>
  <div id="dlg" hidden>
    <div id="dBust"></div>
    <div id="dName"></div>
    <div id="dBody"><div id="dText"></div><div id="dTap">tap to continue</div></div>
    <button id="dSkip">Skip</button>
  </div>
  <div id="pausemenu" hidden></div>
  <div id="screens"></div>
  <div id="dbg" hidden></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-score" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.600 6.200 6.700.6-5.100 4.400 1.600 6.600L12 16.300 6.200 19.800l1.600-6.600L2.700 8.800l6.700-.6z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round" stroke-linecap="round" d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5zM12 14.500v3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.900" stroke-linejoin="round" stroke-linecap="round" d="M2.500 5.300c3.200-1.400 6.400-1.200 9.500 1.100v13.300c-3.100-2.300-6.300-2.500-9.500-1.100zM21.500 5.300c-3.200-1.400-6.400-1.200-9.500 1.100v13.300c3.100-2.300 6.300-2.500 9.500-1.100zM5.300 9.200c1.700-.4 3.300-.2 4.700.7M5.300 12.700c1.700-.4 3.300-.2 4.700.7M18.700 9.200c-1.700-.4-3.300-.2-4.700.7M18.700 12.700c-1.700-.4-3.300-.2-4.700.7"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-4 12.700V17h8v-2.300A7 7 0 0 0 12 2zM9 19h6v1.500a1.500 1.500 0 0 1-1.500 1.500h-3A1.500 1.500 0 0 1 9 20.500z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.500" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/><rect x="14.300" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4.500 12.500l5 5 10-11"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 13V6a1.500 1.500 0 0 1 3 0v5m0-1V4.500a1.500 1.500 0 0 1 3 0V11m0-4a1.500 1.500 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-2-3.500a1.500 1.500 0 0 1 2.500-1.500L8 14"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M5 21V8a7 7 0 0 1 14 0v13M3 21h18M12 11v4M9.500 13h5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.200 6.800H21l-5.600 4.100 2.100 6.800L12 15.600 6.500 19.700l2.100-6.800L3 8.800h6.800z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<script src="vendor/pannellum.js"></script>
<script src="audio.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
