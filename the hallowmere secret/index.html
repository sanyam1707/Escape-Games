<body>
<div id="app">
  <div id="pano"></div>
  <div id="fog"></div>
  <div id="hud" hidden>
    <div id="hud-row">
      <div id="hud-time" class="hud-box"><span class="bell">&#128276;</span><b id="time">12:00</b></div>
      <div id="hud-score" class="hud-box"><small id="lbl-ev"></small><b id="score">0</b></div>

    </div>
    <div id="objective"><b id="lbl-obj"></b><span id="obj-text"></span></div>
  </div>
  <div id="strip" hidden></div>
  <div id="bar" hidden>
    <div class="bb"><button id="btn-pause" class="ibtn" aria-label="Pause"></button><span class="bl" id="lbl-pause"></span></div>
    <div class="bb"><button id="btn-hint" class="ibtn" aria-label="Hint"></button><span class="bl" id="lbl-hint"></span></div>
    <div class="bb"><button id="btn-book" class="ibtn" aria-label="Casebook"></button><span class="bl" id="lbl-book"></span></div>
    <div id="tray" hidden></div>
  </div>
  <button id="btn-pause2" class="ibtn small" hidden aria-label="Pause"></button>
  <div id="edge" hidden>&#10148;</div>
  <div id="drag-hand" hidden>&#9755;</div>
  <div id="layer"></div>
  <div id="toast"></div>
  <div id="debug" hidden></div>
</div>
