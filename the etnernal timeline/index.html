<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F12">
<title>The Eternal Timeline</title>
<meta name="description" content="A dark 360 mystery escape game. Ten minutes. One missing brother. One loop to cut.">
<meta property="og:title" content="The Eternal Timeline">
<meta property="og:description" content="A dark 360 mystery escape game. Ten minutes. One missing brother. One loop to cut.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/sheets/tap_to_start.jpg">
<link rel="stylesheet" href="vendor/pannellum.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- icon set: crisp SVG, brass tinted via currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 4.5h11a3 3 0 0 1 3 3V19H8a3 3 0 0 1-3-3V4.5Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 16a3 3 0 0 1 3-3h11M9 7.5h6"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c1.9 2.2 2.8 3.9 2.8 5.2A2.8 2.8 0 0 1 12 10a2.8 2.8 0 0 1-2.8-2.8C9.2 5.600 10.600 4.200 12 2Z"/><rect x="8" y="11.500" width="8" height="7" rx="1.200" fill="none" stroke="currentColor" stroke-width="1.800"/><path stroke="currentColor" stroke-width="1.800" stroke-linecap="round" d="M6 21.500h12"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/><rect x="13.800" y="4.500" width="4.200" height="15" rx="1.200" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" d="M5.500 5.500l13 13M18.500 5.500l-13 13"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.800"/><path fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" d="M12 8.500V13l-3 2M9.500 2.500h5"/></symbol>
    <symbol id="i-thread" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" d="M4 8c4-5 8 3 12-1s4 1 4 1M4 13c4-5 8 3 12-1s4 1 4 1M4 18c4-5 8 3 12-1s4 1 4 1"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" d="M9 11V5.500a1.500 1.500 0 0 1 3 0V10m0-1.500a1.500 1.500 0 0 1 3 0V11m0-1a1.500 1.500 0 0 1 3 0v4.500A6 6 0 0 1 12 21c-3 0-4-1.500-6-4.500L4.800 14.500a1.500 1.500 0 0 1 2.400-1.700L9 15"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.500-6.500 10-6.500S22 12 22 12s-3.500 6.500-10 6.500S2 12 2 12Z"/><circle cx="12" cy="12" r="2.800" fill="currentColor"/></symbol>
    <symbol id="i-socket" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.200" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v4M12 17v4M3 12h4M17 12h4"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M12 20V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="pano"></div>
  <div id="shade"></div>
  <div id="grain"></div>
  <canvas id="fx"></canvas>
  <div id="vig"></div>

  <div id="hud">
    <div id="topbar">
      <div class="chip" id="threads"><span class="lbl">Threads</span><b id="score">0</b></div>
      <button id="watchBtn" class="click" aria-label="Noel's watch and Timeline"></button>
      <div class="chip" id="clock"><svg><use href="#i-clock"/></svg><b id="time">10:00</b></div>
    </div>
    <div id="objective"><span class="tag" id="objTag"></span><span class="txt" id="objText"></span></div>
    <div id="findstrip"></div>
    <div id="holding" hidden></div>
    <div id="bottombar">
      <button id="hintBtn" class="hbtn" aria-label="Hint"><svg><use href="#i-hint"/></svg><span>Hint</span><i id="hintCount">3</i></button>
      <span class="grow"></span>
      <button id="bookBtn" class="hbtn" aria-label="Timeline Book"><svg><use href="#i-book"/></svg><span>Book</span></button>
      <button id="pauseBtn" class="hbtn" aria-label="Pause"><svg><use href="#i-pause"/></svg><span>Pause</span></button>
    </div>
  </div>

  <div id="sightui">
    <div class="wire" id="wire"></div><div class="scope" id="scope"></div>
    <div class="sbar surface"><div class="tip" id="sightTip"></div><button class="xbtn" id="sightX" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <div class="sbot surface"><div class="rbig" id="sightBig"></div><div class="prog" id="sightProg"></div><div class="reads" id="sightReads"></div><button class="btn primary" id="sightRead">Read</button></div>
  </div>

  <div id="panels"></div>
  <div id="book" class="surface"></div>
  <div id="dlgcatch"></div>
  <div id="dlg" class="surface"></div>
  <div id="cards"></div>
  <div id="ending"><div class="etext" id="etext"></div><div class="etap">tap to continue</div><button class="skipbtn" id="endSkip">Skip</button></div>
  <div id="toasts"></div>

  <div id="start" class="screen on">
    <div class="bg" id="startBg"></div>
    <h1><small>A MYSTERY IN 360</small>THE ETERNAL TIMELINE</h1>
        <div class="tapto">Tap to Start</div>
  </div>

  <div id="mission" class="screen">
    <div class="fallbackbg"></div><div class="bg" id="missionBg"></div>
    <div class="copy" id="missionCopy"></div>
  </div>

  <div id="tutorial" class="screen">
    <div id="spot"></div>
    <div class="demo hand" id="demoHand"></div>
    <div class="demo glowdot" id="demoGlow"></div>
    <div id="tutcard" class="surface"></div>
  </div>

  <div id="pause" class="screen"></div>
  <div id="end" class="screen"></div>
  <div id="curtain"></div>
  <div id="flash"></div>
</div>

<script src="vendor/pannellum.js"></script>
<script src="puzzles.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
