<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1420">
<title>The 13 Forgotten Keys</title>
<meta name="description" content="A spooky 360 escape game. Find 13 forgotten keys in Wardlow House before the tide comes in.">
<meta property="og:title" content="The 13 Forgotten Keys">
<meta property="og:description" content="A spooky 360 escape game. Seven rooms, thirteen keys, ten minutes.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="vendor/pannellum.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="pano"></div>
  <div id="vignette"></div>
  <div id="sepia"></div>
  <canvas id="fx"></canvas>
  <div id="fx-ink"></div>
  <div id="sight" hidden><div class="ring"></div><div class="dot"></div><p>Turn until the ring locks on.</p></div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="hud-top">
      <div id="wards" title="Wards"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.6 20 12 16.6 6.4 20 8 13.4 3 9l6.4-.6z"/></svg><b id="wards-n">0</b></div>
      <div id="clock">10:00</div>
      <button id="btn-pause" class="ibtn" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    </div>
    <div id="objective"><span id="room-name"></span><span id="obj-text"></span></div>
    <div id="find-strip"></div>
    <div id="holding" hidden><span id="holding-name"></span><button id="holding-x" aria-label="Put away">&times;</button></div>
    <div id="hud-bottom">
      <button id="btn-keys" class="hbtn"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M15 12v3"/></svg><span>Key Ring</span><em id="keys-n">0/13</em></button>
      <button id="btn-hint" class="hbtn hint"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 20h5"/></svg><span>Hint</span><i id="pips"></i></button>
      <button id="btn-book" class="hbtn"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 4v13"/></svg><span>Book</span><em id="book-n">0</em></button>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" hidden></div>
  <div id="dlg" hidden></div>
  <div id="tut" hidden></div>
  <div id="pause" hidden></div>
  <div id="screen"></div>
  <div id="debugbar" hidden></div>
  <noscript><p class="boot">This game needs JavaScript.</p></noscript>
</div>
<script src="vendor/pannellum.js"></script>
<script src="logic.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
