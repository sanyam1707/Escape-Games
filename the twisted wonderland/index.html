<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Twisted Wonderland</title>
<meta name="description" content="A 360 escape game. Flip the Twisted Rules of Wonderland and restart time in ten minutes.">
<meta property="og:title" content="The Twisted Wonderland">
<meta property="og:description" content="A 360 escape game in a storybook-gothic Wonderland. Ten minutes. Seven rooms. One Cat.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/sheets/title_key.jpg">
<meta name="theme-color" content="#1E1A2B">
<link rel="stylesheet" href="vendor/pann.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"><div id="pano"></div></div>
  <div id="hs"></div>
  <div id="fxv"></div>
  <div id="hud" class="off">
    <div class="hud-top">
      <div class="grp"><div class="pill timer" id="timer"></div><div class="pill wits" id="wits"></div></div>
      <div class="hud-mid"><div class="hud-goal" id="goal"></div><div class="hud-find" id="find"></div></div>
    </div>
    <div class="hud-bottom">
      <button class="hbtn" id="bookBtn"></button>
      <div class="held" id="held"></div>
      <button class="hbtn" id="hintBtn"></button>
    </div>
  </div>
  <button id="pauseBtn" class="pausebtn off"></button>
  <div id="fade"></div>
  <div id="modals"></div>
  <div id="dlg"></div>
  <div id="toast"></div>
  <div id="screens"></div>
  <div id="dbg" hidden></div>
</div>
<script src="vendor/pann.js"></script>
<script src="puzzles.js"></script>
<script src="panels.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
